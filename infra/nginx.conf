events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Frontend1 (Landing Page)
        location / {
            proxy_pass http://frontend1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend2 (Admin + tenant dashboard routes)
        location ~ ^/(login|dashboard|tenants|users|agents|devices|sessions|workflows|analytics|settings|tenant)(/.*)?$ {
            proxy_pass http://frontend2:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /_next/ {
            proxy_pass http://frontend2:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket for LiveKit/Realtime
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
